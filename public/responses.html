<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#efe2eb">
  <title>Wedding responses | Ginikachi &amp; Godwin</title>
  <link rel="icon" type="image/svg+xml" href="assets/monogram.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="responses.js" defer></script>
</head>
<body class="responses-page">
  <main class="responses-shell">
    <header class="responses-header">
      <div>
        <p class="caps">Private page</p>
        <h1>Guest <i>responses</i></h1>
        <p>Messages and attendance replies for Ginikachi and Godwin.</p>
      </div>
      <a class="text-link" href="/invite">Back to the invitation</a>
    </header>

    <form class="responses-login" id="responses-login">
      <label for="responses-password">Private access password</label>
      <div class="responses-login-row">
        <input id="responses-password" name="password" type="password" autocomplete="current-password" required>
        <button class="pill" type="submit">View responses</button>
      </div>
      <p class="responses-error" id="responses-error" role="alert"></p>
    </form>

    <section id="responses-content" hidden>
      <div class="responses-toolbar">
        <p id="responses-count"></p>
        <button class="text-link" id="download-responses" type="button">Download all as TXT</button>
      </div>
      <div class="responses-list" id="responses-list"></div>
    </section>
  </main>
</body>
</html>
